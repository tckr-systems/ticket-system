services:
  mongo:
    image: mongo:8
    tmpfs:
      - /data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: .
    command: >
      bash -c "bundle exec rails tailwindcss:build &&
               bundle exec rails db:mongoid:create_indexes &&
               bundle exec rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      MONGO_URI: mongodb://mongo:27017/ticket_system_development
      SECRET_KEY_BASE: dev-local-compose-secret-do-not-reuse
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
    stdin_open: true
    tty: true
